<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pro - SHOP BITHACOM</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="login-screen" style="display:flex; justify-content:center; align-items:center; height:100vh; background:#f3f4f6;">
        <div class="admin-panel" style="width:100%; max-width:400px; text-align:center;">
            <h2 style="border:none;">🔒 Accès Gérant</h2>
            <form id="login-form" style="display:flex; flex-direction:column; gap:15px; margin-top:20px;">
                <input type="password" id="admin-password" placeholder="Mot de passe" style="padding:12px; border:1px solid #ccc; border-radius:8px;" required>
                <button type="submit" style="padding:12px; background:#1e3a8a; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Se connecter</button>
            </form>
        </div>
    </div>

    <div class="admin-layout" id="admin-dashboard" style="display:none;">
        <aside class="admin-sidebar">
            <div class="brand">SHOP <span>BITHACOM</span></div>
            <a href="#" onclick="showTab('produits')" id="tab-produits" class="active">📦 Produits</a>
            <a href="#" onclick="showTab('avis')" id="tab-avis">⭐ Avis Clients</a>
            <a href="index.html" target="_blank">🌐 Voir le site</a>
            <a href="#" onclick="logout()">🚪 Déconnexion</a>
        </aside>

        <main class="admin-main">
            <!-- SECTION PRODUITS -->
            <div id="section-produits">
                <h1>Gestion des Produits</h1>
                <div class="admin-panel">
                    <h2>➕ Ajouter un produit</h2>
                    <form class="admin-form" id="product-form">
                        <input type="text" id="p-name" placeholder="Nom du produit" required>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="p-price" placeholder="Prix" style="flex:2;" required>
                            <select id="p-currency" style="flex:1; padding:12px; border:1px solid #cbd5e1; border-radius:8px;">
                                <option value="USD">$ USD</option>
                                <option value="FC">FC</option>
                            </select>
                        </div>
                        <select id="p-category" class="full-width" style="padding:12px; border:1px solid #cbd5e1; border-radius:8px;">
                            <option value="standard">Standard (Aucune catégorie)</option>
                            <option value="nouveaute">Nouveauté</option>
                            <option value="promotion">Promotion</option>
                            <option value="best-seller">Meilleure vente</option>
                        </select>
                        <input type="url" id="p-img" placeholder="Lien de l'image" class="full-width" required>
                        <textarea id="p-desc" placeholder="Description" class="full-width" rows="2" required></textarea>
                        <button type="submit" class="full-width" style="background:#10b981;">💾 Enregistrer</button>
                    </form>
                </div>
                <div class="admin-panel">
                    <h2>📦 Liste des produits</h2>
                    <table class="admin-table"><thead><tr><th>Image</th><th>Nom</th><th>Prix</th><th>Catégorie</th><th>Action</th></tr></thead><tbody id="product-list"></tbody></table>
                </div>
            </div>

            <!-- SECTION AVIS -->
            <div id="section-avis" style="display:none;">
                <h1>Gestion des Avis Clients</h1>
                <div class="admin-panel">
                    <h2>➕ Ajouter un avis</h2>
                    <form class="admin-form" id="avis-form">
                        <input type="text" id="a-name" placeholder="Nom du client" required>
                        <input type="number" id="a-note" placeholder="Note (1 à 5)" min="1" max="5" required>
                        <textarea id="a-comment" placeholder="Commentaire" class="full-width" rows="2" required></textarea>
                        <button type="submit" class="full-width" style="background:#3b82f6;">💾 Publier l'avis</button>
                    </form>
                </div>
                <div class="admin-panel">
                    <h2>⭐ Liste des avis</h2>
                    <table class="admin-table"><thead><tr><th>Client</th><th>Note</th><th>Commentaire</th><th>Action</th></tr></thead><tbody id="avis-list"></tbody></table>
                </div>
            </div>
        </main>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
