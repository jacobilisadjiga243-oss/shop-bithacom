<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - SHOP BITHACOM</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">SHOP<span> BITHACOM</span></div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="produits.html">Produits</a>
            <a href="admin.html" style="color: #fbbf24;">Admin</a>
        </nav>
    </header>

    <div id="login-section" class="admin-container">
        <h2>🔒 Accès Gérant</h2>
        <form class="admin-form" id="login-form">
            <input type="password" id="admin-password" placeholder="Entrez le mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
        <p style="text-align:center; margin-top:15px; font-size:12px; color:#666;">(Mot de passe par défaut : bitha2025)</p>
    </div>

    <div id="admin-section" class="admin-container" style="display:none;">
        <h2>📦 Gestion des Produits</h2>
        <form class="admin-form" id="product-form">
            <input type="text" id="p-name" placeholder="Nom du produit" required>
            <input type="text" id="p-price" placeholder="Prix (ex: 150 000 FCFA)" required>
            <input type="text" id="p-desc" placeholder="Description courte" required>
            <input type="url" id="p-img" placeholder="Lien de l'image (URL)" required>
            <button type="submit">➕ Ajouter le produit</button>
        </form>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Nom</th>
                    <th>Prix</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <!-- Les produits s'afficheront ici -->
            </tbody>
        </table>
        
        <button onclick="generateCode()" style="margin-top:20px; width:100%; padding:15px; background:#1e3a8a; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">📋 Générer le code pour le site</button>
        
        <div id="code-output" style="display:none; margin-top:20px;">
            <p>Copie ce code et remplace la grille dans <code>produits.html</code> :</p>
            <textarea id="code-text" style="width:100%; height:200px; font-family:monospace; padding:10px;"></textarea>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
