<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos Adresses - SHOP BITHACOM</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">SHOP<span> BITHACOM</span></div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="produits.html">Produits</a>
            <a href="voyages.html">Agence de Colis</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <h1 class="page-title">Nos Adresses à Gbadolite</h1>
    <p class="page-subtitle">Retrouvez-nous dans nos boutiques et notre agence</p>

    <div class="section-padding">
        <div class="products-grid" id="adresses-container"></div>
    </div>

    <!-- CARTE GOOGLE MAPS -->
    <div class="section-padding">
        <div class="section-header"><h2>Nous trouver sur la carte</h2></div>
        <div style="border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.5!2d20.9!3d4.3!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2sGbadolite!5e0!3m2!1sfr!2scd!4v1600000000000" 
                width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy">
            </iframe>
        </div>
    </div>

    <footer class="footer-pro">
        <div class="footer-bottom"><p>&copy; 2026 SHOP BITHACOM.</p></div>
    </footer>

    <script>
        fetch('/api/adresses')
            .then(res => res.json())
            .then(adresses => {
                const container = document.getElementById('adresses-container');
                if(adresses.length === 0) {
                    container.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>Aucune adresse disponible.</p>";
                    return;
                }
                adresses.forEach(a => {
                    // Icônes SVG professionnelles
                    let iconSvg = '';
                    if(a.type_lieu === 'Agence') {
                        iconSvg = '<svg width="24" height="24" fill="#1e3a8a" viewBox="0 0 24 24" style="vertical-align:middle; margin-right:10px;"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 16H7V5h10v14zm-3-6h-4v2h4v-2zm0-4h-4v2h4V9z"/></svg>';
                    } else {
                        iconSvg = '<svg width="24" height="24" fill="#1e3a8a" viewBox="0 0 24 24" style="vertical-align:middle; margin-right:10px;"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>';
                    }

                    container.innerHTML += `
                        <div class="product-card" style="padding: 25px; text-align: left; display: flex; flex-direction: column; gap: 8px;">
                            <h3 style="color: #1e3a8a; display: flex; align-items: center; font-size: 18px; margin: 0;">
                                ${iconSvg} ${a.nom_lieu}
                            </h3>
                            <p style="font-size: 13px; color: #64748b; margin: 0; font-weight: 600; text-transform: uppercase;">${a.type_lieu}</p>
                            <p style="font-size: 15px; color: #333; display: flex; align-items: center; gap: 8px; margin: 0; margin-top: 5px;">
                                <svg width="16" height="16" fill="#ef4444" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                                ${a.adresse}
                            </p>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
