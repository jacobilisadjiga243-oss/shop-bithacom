<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos Adresses - SHOP BITHACOM</title>
    <meta name="description" content="Retrouvez les adresses de SHOP BITHACOM à Gbadolite : Agence Rue Nganza, Shops Rue Mbui et Rue Mwanda. Contactez-nous !">
    <meta name="keywords" content="adresse bithacom gbadolite, contact boutique gbadolite, shop bithacom">
    <meta property="og:title" content="Nos Adresses à Gbadolite - SHOP BITHACOM">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">SHOP<span> BITHACOM</span></div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="produits.html">Produits</a>
            <a href="voyages.html">Agence de Colis</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <h1 class="page-title">Nos Adresses à Gbadolite</h1>
    <p class="page-subtitle">Retrouvez-nous dans nos boutiques et notre agence</p>

    <div class="section-padding">
        <div class="products-grid" id="adresses-container"></div>
    </div>

    <!-- CARTE GOOGLE MAPS -->
    <div class="section-padding">
        <div class="section-header"><h2>Nous trouver sur la carte</h2></div>
        <div style="border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.5!2d20.9!3d4.3!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2sGbadolite!5e0!3m2!1sfr!2scd!4v1600000000000" 
                width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy">
            </iframe>
        </div>
    </div>

    <footer class="footer-pro">
        <div class="footer-bottom"><p>&copy; 2026 SHOP BITHACOM.</p></div>
    </footer>

    <script>
        fetch('/api/adresses')
            .then(res => res.json())
            .then(adresses => {
                const container = document.getElementById('adresses-container');
                if(adresses.length === 0) {
                    container.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>Aucune adresse disponible.</p>";
                    return;
                }
                adresses.forEach(a => {
                    // Icônes SVG professionnelles
                    let iconSvg = '';
                    if(a.type_lieu === 'Agence') {
                        iconSvg = '<svg width="24" height="24" fill="#1e3a8a" viewBox="0 0 24 24" style="vertical-align:middle; margin-right:10px;"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 16H7V5h10v14zm-3-6h-4v2h4v-2zm0-4h-4v2h4V9z"/></svg>';
                    } else {
                        iconSvg = '<svg width="24" height="24" fill="#1e3a8a" viewBox="0 0 24 24" style="vertical-align:middle; margin-right:10px;"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>';
                    }

                    container.innerHTML += `
                        <div class="product-card" style="padding: 25px; text-align: left; display: flex; flex-direction: column; gap: 8px;">
                            <h3 style="color: #1e3a8a; display: flex; align-items: center; font-size: 18px; margin: 0;">
                                ${iconSvg} ${a.nom_lieu}
                            </h3>
                            <p style="font-size: 13px; color: #64748b; margin: 0; font-weight: 600; text-transform: uppercase;">${a.type_lieu}</p>
                            <p style="font-size: 15px; color: #333; display: flex; align-items: center; gap: 8px; margin: 0; margin-top: 5px;">
                                <svg width="16" height="16" fill="#ef4444" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                                ${a.adresse}
                            </p>
                        </div>
                    `;
                });
            });
    </script>
<!-- MENU WHATSAPP INTERACTIF -->
<div class="wa-menu-overlay" id="wa-menu">
    <div class="wa-menu-box">
        <h3 style="display:flex; align-items:center; justify-content:center; gap:10px;">
            <svg width="28" height="28" fill="#f59e0b" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .68-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
            Comment pouvons-nous vous aider ?
        </h3>
        
        <a href="https://wa.me/243819770888?text=Bonjour,%20je%20souhaite%20commander%20un%20produit%20de%20la%20boutique." target="_blank" class="wa-menu-btn green">
            <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            Commander un produit
        </a>
        
        <a href="https://wa.me/243819770888?text=Bonjour,%20je%20souhaite%20envoyer%20un%20colis%20via%20votre%20agence." target="_blank" class="wa-menu-btn blue">
            <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4h16v3z"/></svg>
            Envoyer un colis
        </a>
        
        <a href="https://wa.me/243819770888?text=Bonjour,%20j'ai%20une%20question." target="_blank" class="wa-menu-btn orange">
            <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            Autre question
        </a>
        
        <button class="wa-menu-close" onclick="fermerWaMenu()">Fermer</button>
    </div>
</div>

<!-- BOUTON FLOTTANT -->


<script>
    function ouvrirWaMenu() { document.getElementById('wa-menu').style.display = 'flex'; }
    function fermerWaMenu() { document.getElementById('wa-menu').style.display = 'none'; }
    document.getElementById('wa-menu').addEventListener('click', function(e) {
        if(e.target === this) fermerWaMenu();
    });
</script>
</body>
</html>
