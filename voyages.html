<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agence de Colis - SHOP BITHACOM</title>
    <meta name="description" content="Envoyez vos colis par voie aérienne, maritime ou terrestre depuis Gbadolite avec SHOP BITHACOM. Prix au kilo, livraison sécurisée.">
    <meta name="keywords" content="agence colis gbadolite, envoi colis rdc, fret aerien gbadolite, transport maritime rdc, fret terrestre">
    <meta property="og:title" content="Agence de Colis & Fret - SHOP BITHACOM">
    <meta property="og:description" content="Envoyez vos colis par voie aérienne, maritime ou terrestre.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">SHOP<span> BITHACOM</span></div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="produits.html">Produits</a>
            <a href="voyages.html">Agence de Colis</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <h1 class="page-title">Agence de Fret & Colis</h1>
    <p class="page-subtitle">Envoyez vos colis par voie aérienne, maritime ou terrestre</p>

    <div class="products-grid" id="voyages-container"></div>

    <footer class="footer-pro">
        <div class="footer-bottom"><p>&copy; 2026 SHOP BITHACOM.</p></div>
    </footer>

    <script>
        fetch('/api/voyages')
            .then(res => res.json())
            .then(voyages => {
                const container = document.getElementById('voyages-container');
                if(!container) return;
                if(voyages.length === 0) {
                    container.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>Aucun programme d'envoi disponible pour le moment.</p>";
                    return;
                }
                voyages.forEach(v => {
                    const priceDisplay = v.devise === 'USD' ? `$ ${v.prix} / kg` : `${v.prix} FC / kg`;
                    const icon = v.type_voyage === 'aerien' ? '✈️' : v.type_voyage === 'maritime' ? '🚢' : '🚌';
                    container.innerHTML += `
                        <div class="product-card">
                            <img src="${v.image_url || 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=500'}" alt="${v.destination}" style="height: 200px; object-fit: cover;">
                            <div class="product-info">
                                <h3>${icon} ${v.destination}</h3>
                                <p class="desc">${v.description}</p>
                                <p style="color: #3b82f6; font-weight: bold; margin: 10px 0;">📅 ${v.date_depart}</p>
                                <p class="price">${priceDisplay}</p>
                                <button class="btn-buy" onclick="window.open('https://wa.me/243819770888?text=Bonjour, je souhaite envoyer un colis vers ${v.destination} le ${v.date_depart}.', '_blank')">📦 Envoyer un colis</button>
                            </div>
                        </div>
                    `;
                });
            });
    </script>
<!-- MENU WHATSAPP INTERACTIF -->
<div class="wa-menu-overlay" id="wa-menu">
    <div class="wa-menu-box">
        <h3>👋 Comment pouvons-nous vous aider ?</h3>
        <a href="https://wa.me/243819770888?text=Bonjour,%20je%20souhaite%20commander%20un%20produit%20de%20la%20boutique." target="_blank" class="wa-menu-btn green">
            🛍️ Commander un produit
        </a>
        <a href="https://wa.me/243819770888?text=Bonjour,%20je%20souhaite%20envoyer%20un%20colis%20via%20votre%20agence." target="_blank" class="wa-menu-btn blue">
            📦 Envoyer un colis
        </a>
        <a href="https://wa.me/243819770888?text=Bonjour,%20j'ai%20une%20question." target="_blank" class="wa-menu-btn orange">
            💬 Autre question
        </a>
        <button class="wa-menu-close" onclick="fermerWaMenu()">Fermer</button>
    </div>
</div>

<!-- BOUTON FLOTTANT -->
<div class="whatsapp-float" onclick="ouvrirWaMenu()" style="cursor:pointer;">
    <svg viewBox="0 0 24 24" width="35" height="35" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</div>

<script>
    function ouvrirWaMenu() {
        document.getElementById('wa-menu').style.display = 'flex';
    }
    function fermerWaMenu() {
        document.getElementById('wa-menu').style.display = 'none';
    }
    // Fermer en cliquant en dehors
    document.getElementById('wa-menu').addEventListener('click', function(e) {
        if(e.target === this) fermerWaMenu();
    });
</script>
</body>
</html>
